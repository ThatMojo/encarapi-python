[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "encarapi"
version = "1.1.1"
description = "Official Python client for EnCarAPI: Korean used car data (Encar, KB Chachacha, K Car) and Chinese used car data (Dongchedi, Che168) in one REST API."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "EnCarAPI", email = "support@encarapi.com" }]
keywords = [
    "encar",
    "encar api",
    "encar.com",
    "kbchacha",
    "kb chachacha",
    "kcar",
    "k car",
    "korean car api",
    "korea car api",
    "korean used car data",
    "china car api",
    "chinese used car data",
    "che168",
    "dongchedi",
    "car export",
    "vehicle data api",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.20"]

[project.urls]
Homepage = "https://encarapi.com/?utm_source=pypi&utm_medium=encarapi-python"
Documentation = "https://encarapi.com/documentation?utm_source=pypi&utm_medium=encarapi-python"
Source = "https://github.com/ThatMojo/encarapi-python"
"China data" = "https://chinacarapi.com/?utm_source=pypi&utm_medium=encarapi-python"

[tool.hatch.build.targets.wheel]
packages = ["encarapi"]
